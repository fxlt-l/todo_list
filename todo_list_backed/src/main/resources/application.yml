
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: todo_list_backed
  datasource:
    url: jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  sql:
    init:
      platform: h2
      mode: always

# MyBatis Plus ??
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      cache-enabled: false
      call-setters-on-nulls: true
      jdbc-type-for-null: 'null'

# ????
logging:
  level:
    com.xiaochen.todo_list_backed.mapper: debug